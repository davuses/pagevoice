name: Release Windows installer

# Compile the Inno Setup installer for PageVoice Server on a Windows runner
# and attach pagevoice-server-setup.exe to the GitHub Release for each pushed
# v* tag. Can also be run manually (workflow_dispatch) to produce a test build.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force server/installer/Output | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" `
            /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll `
            /win32icon:server/installer/pagevoice.ico `
            /out:server/installer/Output/PageVoice.exe server/installer/Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "PageVoice launcher compilation failed" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "server\installer\kokoro-server.iss"

      - name: Test fresh install and in-place shortcut repair
        shell: pwsh
        run: ./server/installer/test-install.ps1 -Installer server/installer/Output/pagevoice-server-setup.exe

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-test-logs
          path: ${{ runner.temp }}/pagevoice-*.log
          if-no-files-found: ignore

      - name: Upload installer artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: server/installer/Output/*.exe

      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The extension workflow owns release creation. Waiting here avoids
          # both workflows racing to create/finalize a release for the same tag.
          $tag = "${{ github.ref_name }}"
          $releaseReady = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            gh release view $tag --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            Write-Host "Waiting for release $tag ($attempt/30)..."
            Start-Sleep -Seconds 5
          }
          if (-not $releaseReady) {
            throw "Release $tag was not created by the extension workflow"
          }
          gh release upload $tag `
            "server/installer/Output/pagevoice-server-setup.exe" `
            --repo "${{ github.repository }}" `
            --clobber
