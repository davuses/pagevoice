<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageVoice Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <h1 class="popup-title">PageVoice</h1>
      <div class="tts-option">
        <label for="tts-select" class="option-label"
          >Choose a TTS Service</label
        >
        <!-- Kokoro voices are populated by popup.js from the server's /voices
             endpoint (with a hardcoded fallback if the server is offline). -->
        <select id="tts-select" class="option-select">
          <option value="google-translate" selected>Google Translate</option>
          <option value="kokoro">Kokoro (local)</option>
          <option value="pocket">Pocket TTS (local)</option>
        </select>
        <div id="server-status" class="server-status" style="display: none;"></div>
      </div>

      <div id="voice-row" class="tts-option" style="display: none;">
        <label for="voice-select" class="option-label">Voice</label>
        <select id="voice-select" class="option-select"></select>
      </div>
      <div id="server-url-row" class="tts-option" style="display: none;">
        <label for="server-url" class="option-label">Local speech server URL</label>
        <input
          id="server-url"
          class="option-input"
          type="text"
          placeholder="http://localhost:18001"
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <div id="speed-row" class="tts-option" style="display: none;">
        <label for="speed-range" class="option-label"
          >Speed: <span id="speed-value">1.0×</span></label
        >
        <input
          id="speed-range"
          class="option-input speed-range"
          type="range"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />
      </div>

      <div id="lookahead-row" class="tts-option" style="display: none;">
        <label for="lookahead-select" class="option-label">Generate ahead</label>
        <select id="lookahead-select" class="option-select">
          <option value="0" selected>Unlimited (instant seek)</option>
          <option value="60">60 seconds</option>
          <option value="30">30 seconds</option>
        </select>
      </div>

      <div id="auto-scroll-row" class="tts-option" style="display: none;">
        <label for="auto-scroll" class="checkbox-label">
          <input id="auto-scroll" type="checkbox" checked />
          Auto-scroll with highlighted text
        </label>
      </div>

      <button id="read-article-btn" class="pick-btn">📖 Read main article</button>
      <button id="pick-element-btn" class="pick-btn">🎯 Pick element to read</button>
      <div class="toggle-hint">
        Then hover &amp; click a paragraph or section on the page. To read part of
        a page, select the text, right-click &rarr; “Read selection aloud”.
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
