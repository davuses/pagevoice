[project]
name = "kokoro-server"
version = "3.0.1"
description = "PageVoice local speech server for Kokoro and Pocket TTS."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "davuses" }]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.116.1",
    "kokoro>=0.9.4",
    # Validated with Kokoro; Pocket TTS requires NumPy 2 or newer.
    "numpy==2.2.6",
    "pocket-tts==4.0.1",
    # Pin the torch series so adding the CUDA index / re-locking doesn't silently
    # jump to a much newer torch that kokoro may not support. The CPU build (PyPI
    # default on Windows) and the CUDA build (cu126 index) both resolve here.
    "torch>=2.7,<2.8",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
# Opt-in NVIDIA GPU build of PyTorch (CUDA 12.6): `uv sync --extra cuda`.
# ~2.5 GB. Without it, torch is the smaller CPU build (the default on Windows;
# on Linux the default torch is already CUDA-enabled). The server uses the GPU
# automatically when a CUDA-capable torch is installed.
cuda = ["torch>=2.7,<2.8; sys_platform == 'linux' or sys_platform == 'win32'"]

[tool.uv]
# Older uv versions can collapse the CPU/CUDA sources into one incompatible
# lock entry. Resolve extras and platform-specific indexes with a modern uv.
required-version = ">=0.8.0"
environments = ["sys_platform != 'darwin' or platform_machine == 'arm64'"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.12'",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# When the `cuda` extra is enabled, pull torch from PyTorch's CUDA index rather
# than the default (which is CPU-only on Windows).
torch = [
    { index = "pypi", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# Optional: the Windows system-tray background launcher (see tray.py). Installed
# by the installer via `uv sync --group tray`; not needed to run the server.
tray = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
